<!DOCTYPE html>
<html>

<head>
  <meta charset="UTF-8" />
  <title>Ethical Analyser</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      width: 380px;
      margin: 0;
      padding: 18px;
      font-family: Arial, sans-serif;
      background: #f7f8fc;
      color: #1f2937;
    }

    .container {
      background: #ffffff;
      border-radius: 14px;
      padding: 18px;
      box-shadow: 0 4px 18px rgba(0, 0, 0, 0.08);
    }

    .header {
      text-align: center;
      margin-bottom: 16px;
    }

    .header h2 {
      margin: 0;
      font-size: 21px;
      color: #111827;
    }

    .header p {
      margin: 8px 0 0;
      font-size: 13px;
      line-height: 1.4;
      color: #6b7280;
    }

    textarea {
      width: 100%;
      height: 135px;
      resize: none;
      border: 1px solid #d1d5db;
      border-radius: 10px;
      padding: 12px;
      font-size: 14px;
      font-family: Arial, sans-serif;
      outline: none;
      transition: border 0.2s ease;
    }

    textarea:focus {
      border-color: #4f46e5;
    }

    .analyze-btn {
      width: 100%;
      margin-top: 12px;
      padding: 12px;
      border: none;
      border-radius: 10px;
      background: #4f46e5;
      color: white;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
      transition: background 0.2s ease;
    }

    .analyze-btn:hover {
      background: #4338ca;
    }

    .info-note {
      margin-top: 12px;
      padding: 10px;
      background: #eef2ff;
      border-radius: 9px;
      color: #4338ca;
      font-size: 12px;
      line-height: 1.4;
    }

    #result {
      margin-top: 16px;
    }

    .loading {
      padding: 12px;
      background: #f3f4f6;
      border-radius: 10px;
      font-size: 14px;
      text-align: center;
      color: #374151;
    }

    .error {
      padding: 12px;
      background: #fee2e2;
      color: #b91c1c;
      border-radius: 10px;
      font-size: 14px;
      line-height: 1.4;
    }

    .score-card {
      background: #f9fafb;
      border-radius: 12px;
      padding: 16px;
      border: 1px solid #e5e7eb;
    }

    .score-title {
      font-size: 14px;
      color: #6b7280;
      margin-bottom: 4px;
    }

    .score-value {
      font-size: 34px;
      font-weight: bold;
      margin-bottom: 6px;
      color: #111827;
    }

    .score-label {
      display: inline-block;
      padding: 6px 10px;
      border-radius: 999px;
      font-size: 13px;
      font-weight: bold;
      margin-bottom: 12px;
    }

    .high {
      background: #dcfce7;
      color: #166534;
    }

    .medium {
      background: #fef3c7;
      color: #92400e;
    }

    .low {
      background: #fee2e2;
      color: #991b1b;
    }

    .explanation-title {
      font-size: 14px;
      font-weight: bold;
      margin-top: 10px;
      margin-bottom: 6px;
      color: #111827;
    }

    .explanation-text {
      font-size: 13px;
      color: #374151;
      line-height: 1.5;
      max-height: 110px;
      overflow-y: auto;
      padding-right: 4px;
    }

    .details-btn {
      width: 100%;
      margin-top: 14px;
      padding: 11px;
      border: none;
      border-radius: 10px;
      background: #111827;
      color: white;
      font-size: 14px;
      font-weight: bold;
      cursor: pointer;
      transition: background 0.2s ease;
    }

    .details-btn:hover {
      background: #000000;
    }

    .spinner {
      width: 22px;
      height: 22px;
      margin: 0 auto 10px auto;
      border: 3px solid #d1d5db;
      border-top: 3px solid #4f46e5;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      0% {
        transform: rotate(0deg);
      }

      100% {
        transform: rotate(360deg);
      }
    }
  </style>
</head>

<body>
  <div class="container">
    <div class="header">
      <h2>Ethical Analyser</h2>
      <p>
        Check AI-generated or online text for trustworthiness,
        unsupported claims, bias, and citation quality.
      </p>
    </div>

    <textarea id="text" placeholder="Paste text here to analyze..."></textarea>

    <button class="analyze-btn" id="analyzeBtn">
      Analyze Text
    </button>

    <div class="info-note">
      The extension can also automatically analyze newly generated AI answers
      directly on supported LLM pages.
    </div>

    <div id="result"></div>
  </div>

  <script src="popup.js"></script>
</body>

</html>
